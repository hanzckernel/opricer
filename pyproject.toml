[project]
name = "opricer"
version = "0.2.0"
description = "American/European option pricer with Finite Difference and MC methods"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "pandas-datareader>=0.10.0",
    "dash>=2.18.0",
    "dash-bootstrap-components>=1.0.0",
    "dash-daq>=0.5.0",
    "beautifulsoup4>=4.12.0",
    "flask-caching>=2.1.0",
    "flask>=3.0.0",
    "gunicorn>=23.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "playwright>=1.40.0",
]
dev = [
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["opricer/tests", "webapp/tests"]
python_files = "test_*.py"
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
